id = "tracing-replay"
order = 9
title = "Execution tracing, observability and replay"
tagline = "Recording what an agent did well enough to explain it and to run it again."
experiment = "tracing"
research = ["otel-genai-agent-spans", "openai-agents-tracing", "langgraph-persistence", "temporal-workflow-execution"]
problem = """
Agent runs are long, branching and non-deterministic. When one goes wrong you need to know what the model saw, what it did and how long each part took, and ideally to re-run the exact sequence against changed code. Different consumers want different shapes: a log to grep, a span tree for a tracing backend, and a tape to replay.
"""
applications = ["Debugging failed runs", "Cost and latency attribution", "Regression tests built from recorded production runs"]
decision = """
Emit one structured event stream from the single place where models and tools are called, then derive the other views from it. Do not instrument each architecture separately.
"""

[[solutions]]
id = "event-log"
name = "Flat event log"
status = "implemented"
summary = "Append one JSON object per model call, tool result, message and state transition."
implementation = "src/agentlab/core/trace.py"
example = "examples/11_trace_and_replay.py"
tests = "tests/test_tracing.py"
result_arch = ["react", "plan_execute", "verified_graph"]
advantages = ["Simple, greppable, diffable", "The system of record for the other two views"]
limitations = ["No hierarchy or durations without post-processing", "Payloads are large"]
performance = "Measured: {{tracing|*|react|events|0}} events and {{tracing|*|react|jsonl_bytes|k}} bytes per ReAct run of 15 steps."
use_when = ["Always"]
avoid_when = ["Never; restrict payloads if they hold sensitive data"]
integration = """
```python
from agentlab.core.trace import Tracer
tracer = Tracer(clock)
rt = Runtime(model, tools, clock=clock, tracer=tracer)
...
tracer.write_jsonl("run.jsonl")
```
"""
frameworks = "Structured logging; LangSmith runs; OpenAI Agents SDK trace events."

