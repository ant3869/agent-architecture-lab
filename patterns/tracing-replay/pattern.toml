```python
from agentlab.core.trace import build_spans
spans = build_spans(tracer.events)     # dicts with trace_id, span_id, parent_span_id, attributes
```
Map these onto your OpenTelemetry SDK's span API to export them.
"""
frameworks = "OpenTelemetry GenAI semantic conventions; Agents SDK trace processors."

[[solutions]]
id = "replay"
name = "Record/replay tape"
status = "implemented"
summary = "Serve recorded model responses and tool results back to the same code, checking that each request matches the recording."
implementation = "src/agentlab/core/trace.py"
example = "examples/11_trace_and_replay.py"
tests = "tests/test_tracing.py"
result_arch = ["react", "plan_execute", "verified_graph"]
diagram = '''
flowchart LR
  E[Recorded events] --> TP[Tape]
  TP --> RM[ReplayModel]
  TP --> RT[ReplayTools]
  RM --> L[Same loop code]
  RT --> L
  L -->|request differs from recording| X[ReplayDivergence]
'''
advantages = ["Deterministic reproduction with no model or backend", "Turns a production run into a regression test", "Detects behavioural change in the loop"]
limitations = ["Only replays the recorded path; cannot answer what-if questions that change a request", "Requires deterministic loop code"]
reliability = "Measured: replay reproduced the full event stream, including timestamps, in {{tracing|*|react|replay_identical|%}} of recorded runs for every loop."
use_when = ["Debugging", "Regression suites", "Cost-free CI for agent code"]
avoid_when = ["Evaluating a prompt or model change (the recording no longer applies)"]
integration = """
```python
from agentlab.core.trace import Tape, ReplayModel, ReplayTools, read_jsonl
tape = Tape(read_jsonl("run.jsonl"))
rt = Runtime(ReplayModel(tape), ReplayTools(tape, specs, clock), clock=clock)
ReActLoop(rt).run(goal)
```
"""
frameworks = "VCR-style HTTP recording; Temporal replay; LangGraph time travel."
